# Lilya v2.1.0 — Catálogo de Localização em Português Brasileiro

[rules.LILYA-001]
description = "Arquivos estáticos de manifesto catalog.json e kombinat.toml são estritamente proibidos"
messages.ERR_STATIC_CATALOG_PROHIBITED = "Manifesto estático catalog.json é proibido; o inventário é gerido pela API do Gossnab"
messages.ERR_STATIC_KOMBINAT_PROHIBITED = "Arquivo estático kombinat.toml é proibido; o estado de dependências é gerido pelo Gossnab"

[rules.LILYA-002]
description = "O arquivo .cccprc deve declarar a forja canônica gambi.2lp.in"
messages.ERR_CCCPRC_MISSING = "Arquivo de configuração .cccprc ausente"
messages.ERR_GAMBI_DOMAIN_MISSING = "Domínio da forja primária gambi.2lp.in não declarado no .cccprc"

[rules.LILYA-003]
description = "Documentação ou site deve incluir a afirmação identitária transfeminista canônica"
messages.ERR_TRANSFEMINIST_IDENTITY_MISSING = "Afirmação identitária transfeminista ausente na documentação"

[rules.LILYA-004]
description = "Arquivos docker compose devem usar estritamente a extensão .yaml, nunca .yml"
messages.ERR_YML_EXTENSION_BANNED = "Extensão .yml é proibida para docker compose; utilize .yaml"

[rules.LILYA-005]
description = "Documentação não deve conter termos proibidos (imperialistas)"
messages.ERR_FORBIDDEN_IMPERIALIST_TERM = "Termo proibido encontrado no arquivo de documentação '{file}'"

[rules.LILYA-006]
description = "Utilitários CLI em post-build devem fornecer --help informativo e --version canônico idêntico ao VERSION"
messages.ERR_CLI_HELP_FAILED = "Conformidade CLI falhou: binário '{binary} --help' falhou ou retornou texto de ajuda insuficiente"
messages.ERR_CLI_VERSION_FAILED = "Conformidade CLI falhou: execução de '{binary} --version' falhou"
messages.ERR_CLI_VERSION_MISMATCH = "Conformidade CLI falhou: saída de '{binary} --version' ('{got}') não contém a versão esperada '{expected}'"
